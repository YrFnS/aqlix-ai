# Alembic Configuration File
# This file contains the configuration settings for Alembic
# Alembic is used for database schema migrations

# path to migration scripts
script_location = apps/api/database/migrations

# sqlalchemy.url
# This can be left blank and configured via environment variable
# sqlalchemy.url = driver://user:pass@localhost/dbname

# The output encoding used when revision files
# are written from script.py.mako.
sqlalchemy.url =

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present
# defaults to the current directory
prepend_sys_path = .

# timezone to use when rendering the date within the migration file as well
# when ordering revision files, local is used if this isn't set
# timezone =

# max length of characters to apply to the "slug" field
# when generating a new migration
# truncate_slug_len = 40

# set to 'true' to run the environment during the 'revision' command
# regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without a source .py file
# This is useful in development when code is edited in an IDE that won't
# write the .py file
# sqlalchemy_module_qualify_prepends =

[loggers]
keys = root,sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
