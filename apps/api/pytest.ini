[tool:pytest]
# pytest configuration for Iraqi AI Chat System API

# Test discovery
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = tests

# Minimum version
minversion = 7.0

# Add options
addopts =
    -ra
    --strict-markers
    --strict-config
    --cov=.
    --cov-report=term-missing:skip-covered
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-fail-under=80
    -p no:warnings

# Markers for different test types
markers =
    unit: Unit tests
    integration: Integration tests
    cultural: Cultural validation tests
    arabic: Arabic language processing tests
    slow: Slow running tests
    api: API endpoint tests
    database: Database related tests

# Test timeout (in seconds)
timeout = 300

# Coverage configuration
[coverage:run]
source = .
omit =
    */tests/*
    */venv/*
    */env/*
    */__pycache__/*
    */migrations/*
    */test_*
    setup.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod