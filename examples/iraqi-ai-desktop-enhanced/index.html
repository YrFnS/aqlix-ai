<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الذكاء الاصطناعي العراقي - واجهة المكتب</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="root" class="iraqi-container">
        <!-- Main application container with RTL direction -->
        <header class="app-header">
            <h1 class="arabic-display">نظام الذكاء الاصطناعي العراقي</h1>
            <nav class="rtl-nav">
                <ul>
                    <li><a href="#personas">إدارة الشخصيات</a></li>
                    <li><a href="#themes">السمات التنظيمية</a></li>
                    <li><a href="#security">مستويات الأمان</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <section id="personas">
                <div id="persona-selector"></div>
            </section>
            <section id="themes">
                <h2 class="arabic-h1">سمات المنظمات المهنية</h2>
                <select aria-label="اختر سمة المنظمة" class="iraqi-select">
                    <option>القانونية</option>
                    <option>الطبية</option>
                    <option>التعليمية</option>
                    <option>الهندسية</option>
                </select>
            </section>
            <section id="security">
                <h2 class="arabic-h1">مستويات التصريح الأمني</h2>
                <select aria-label="اختر مستوى التصريح" class="iraqi-select">
                    <option>عام</option>
                    <option>محدود</option>
                    <option>سري</option>
                </select>
            </section>
        </main>
    </div>
    <script type="module" src="renderer.js"></script>
</body>
</html>
