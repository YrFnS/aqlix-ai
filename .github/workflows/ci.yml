name: CI Quality Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same workflow and branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Lint and TypeCheck (Fast)
  quality-checks:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: |
          echo "Running ESLint on packages with source code..."
          # apps/web should always lint (has code)
          if [ -d "apps/web/src" ] || [ -d "apps/web/app" ]; then
            bun run --filter ./apps/web lint || exit 1
          fi
          # Only lint packages/apps that have src directories
          for dir in packages/* apps/*; do
            if [ -d "$dir/src" ] && [ "$(ls -A $dir/src 2>/dev/null)" ]; then
              echo "Linting $dir..."
              bun run --filter ./$dir lint || exit 1
            else
              echo "Skipping $dir (no source files yet)"
            fi
          done
          echo "✅ ESLint passed for all packages with code"

      - name: Run TypeScript type checking
        run: |
          echo "Running TypeScript type checking..."
          # apps/web should always typecheck
          if [ -d "apps/web" ]; then
            bun run --filter ./apps/web typecheck || exit 1
          fi
          # Only typecheck packages/apps that have tsconfig.json and src
          for dir in packages/* apps/*; do
            if [ -f "$dir/tsconfig.json" ] && [ -d "$dir/src" ] && [ "$(ls -A $dir/src 2>/dev/null)" ]; then
              echo "Type checking $dir..."
              bun run --filter ./$dir typecheck || exit 1
            else
              echo "Skipping $dir (no code yet or no tsconfig)"
            fi
          done
          echo "✅ TypeScript checks passed for all packages with code"

  # Job 2: Build Validation (Medium)
  build:
    name: Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality-checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build:packages

      - name: Build applications
        run: bun run build:apps

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/*/dist
            apps/*/.next
            packages/*/dist
          retention-days: 7

  # Job 3: Unit Tests (Medium)
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality-checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test:unit

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: coverage/
          retention-days: 7

  # Job 4: Success Gate (All must pass)
  ci-success:
    name: CI Success Gate
    runs-on: ubuntu-latest
    needs: [quality-checks, build, test]
    if: always()

    steps:
      - name: Check all jobs succeeded
        run: |
          if [[ "${{ needs.quality-checks.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "❌ CI Failed: One or more jobs did not succeed"
            exit 1
          fi
          echo "✅ All CI checks passed!"
