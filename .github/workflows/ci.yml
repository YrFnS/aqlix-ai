name: CI Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality-checks:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bash scripts/ci/install-dependencies.sh

      - name: Build packages in dependency order
        run: bun run build:packages

      - name: Run ESLint
        run: bun run lint

      - name: Run focused TypeScript validation
        run: bun run typecheck

  build:
    name: Release Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality-checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node LTS
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bash scripts/ci/install-dependencies.sh

      - name: Build packages in dependency order
        run: bun run build:packages

      - name: Build complete release web application
        working-directory: apps/web
        run: bun run build:release

      - name: Upload release build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-build-artifacts
          path: |
            apps/web/.next
            packages/*/dist
          include-hidden-files: true
          retention-days: 7

  test:
    name: Active Rebuild Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality-checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bash scripts/ci/install-dependencies.sh

      - name: Run active rebuild tests
        run: bun run test:unit

  ci-success:
    name: CI Success Gate
    runs-on: ubuntu-latest
    needs: [quality-checks, build, test]
    if: always()

    steps:
      - name: Check all jobs succeeded
        run: |
          if [[ "${{ needs.quality-checks.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "CI failed: one or more required jobs did not succeed"
            exit 1
          fi

          echo "All required lint, type, test, and complete release build checks passed."
