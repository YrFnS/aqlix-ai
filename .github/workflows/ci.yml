name: CI Quality Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality-checks:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bash scripts/ci/install-dependencies.sh

      - name: Build packages in dependency order
        run: bun run build:packages

      - name: Run ESLint
        run: bun run lint

      - name: Run focused TypeScript validation
        run: bun run typecheck

  build:
    name: Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality-checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bash scripts/ci/install-dependencies.sh

      - name: Build packages in dependency order
        run: bun run build:packages

      - name: Build web application
        working-directory: apps/web
        run: bun run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/web/.next
            packages/*/dist
          retention-days: 7

  test:
    name: P0 Foundation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality-checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bash scripts/ci/install-dependencies.sh

      - name: Run active rebuild tests
        run: bun run test:unit

  ci-success:
    name: CI Success Gate
    runs-on: ubuntu-latest
    needs: [quality-checks, build, test]
    if: always()

    steps:
      - name: Check all jobs succeeded
        run: |
          if [[ "${{ needs.quality-checks.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "CI failed: one or more required jobs did not succeed"
            exit 1
          fi

          echo "All required CI checks passed."
