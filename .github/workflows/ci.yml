name: CI Quality Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same workflow and branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Lint and TypeCheck (Fast)
  quality-checks:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint (only packages with code)
        run: |
          # Run lint only on apps/web and packages/supabase-client (have code)
          bun run --filter ./apps/web lint
          bun run --filter @iraqi-ai/supabase-client lint
          echo "✅ ESLint passed (empty packages skipped)"

      - name: Run TypeScript type checking (only packages with code)
        run: |
          # Run typecheck only on apps/web and packages/supabase-client (have code)
          bun run --filter ./apps/web typecheck
          bun run --filter @iraqi-ai/supabase-client typecheck
          echo "✅ TypeScript checks passed (empty packages skipped)"

  # Job 2: Build Validation (Medium)
  build:
    name: Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality-checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build:packages

      - name: Build applications
        run: bun run build:apps

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/*/dist
            apps/*/.next
            packages/*/dist
          retention-days: 7

  # Job 3: Unit Tests (Medium)
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality-checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test:unit

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: coverage/
          retention-days: 7

  # Job 4: Success Gate (All must pass)
  ci-success:
    name: CI Success Gate
    runs-on: ubuntu-latest
    needs: [quality-checks, build, test]
    if: always()

    steps:
      - name: Check all jobs succeeded
        run: |
          if [[ "${{ needs.quality-checks.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "❌ CI Failed: One or more jobs did not succeed"
            exit 1
          fi
          echo "✅ All CI checks passed!"
