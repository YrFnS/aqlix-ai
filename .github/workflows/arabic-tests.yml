name: Arabic & RTL Foundation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rtl-foundation:
    name: Arabic & RTL Foundation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bash scripts/ci/install-dependencies.sh

      - name: Build shared packages in dependency order
        run: bun run build:packages

      - name: Test active RTL product foundation
        run: |
          bun run test:rtl
          bun test apps/web/tests/rebuild/typography-and-primary-copy.test.ts

      - name: Test Arabic processing package
        run: bun run --filter @iraqi-ai/arabic-nlp test

      - name: Test bidirectional UI utilities
        run: bun run --filter @iraqi-ai/ui test

      - name: Verify committed bilingual font configuration
        run: |
          grep -q "Noto_Sans_Arabic" apps/web/src/lib/fonts.ts
          grep -q "Cairo" apps/web/src/lib/fonts.ts
          grep -q "Amiri" apps/web/src/lib/fonts.ts
          grep -q "Inter" apps/web/src/lib/fonts.ts
          grep -q -- '--font-arabic-primary' apps/web/src/lib/fonts.ts
          grep -q -- '--font-arabic-heading' apps/web/src/lib/fonts.ts
          grep -q -- '--font-arabic-formal' apps/web/src/lib/fonts.ts
          grep -q -- '--font-inter' apps/web/src/lib/fonts.ts
          grep -q 'display: "swap"' apps/web/src/lib/fonts.ts

  arabic-success:
    name: Arabic Foundation Success Gate
    runs-on: ubuntu-latest
    needs: [rtl-foundation]
    if: always()

    steps:
      - name: Check Arabic foundation tests
        run: |
          if [[ "${{ needs.rtl-foundation.result }}" != "success" ]]; then
            echo "Arabic, RTL, or bilingual typography validation failed"
            exit 1
          fi

          echo "Arabic text utilities, RTL defaults, and bilingual font wiring passed."
          echo "No dialect-recognition or accuracy percentage is claimed by this workflow."
