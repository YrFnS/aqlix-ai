name: Accessibility Foundation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accessibility-safeguards:
    name: P0 Accessibility Safeguards
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bash scripts/ci/install-dependencies.sh

      - name: Run active accessibility safeguards
        run: bun run test:accessibility

      - name: Type-check the active product foundation
        run: bun run typecheck

      - name: Record scope
        run: |
          echo "Validated: browser zoom, shared touch targets, labelled mobile navigation, and rebuilt-surface icon semantics."
          echo "This workflow is not a WCAG certification and publishes no invented score."

  accessibility-success:
    name: Accessibility Foundation Success Gate
    runs-on: ubuntu-latest
    needs: [accessibility-safeguards]
    if: always()

    steps:
      - name: Check accessibility safeguards
        run: |
          if [[ "${{ needs.accessibility-safeguards.result }}" != "success" ]]; then
            echo "Accessibility foundation safeguards failed"
            exit 1
          fi

          echo "P0 accessibility safeguards passed."
