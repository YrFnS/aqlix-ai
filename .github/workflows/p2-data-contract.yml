name: P2 Conversation Data Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-contract:
    name: PostgreSQL Conversation Lifecycle & RLS
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tuppra_p2_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tuppra_p2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: tuppra_p2_test
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Prepare Supabase-compatible auth harness
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/p1_test_setup.sql

      - name: Apply P1 and P2 migrations
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608080001_p1_workspace_foundation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608080002_p1_owner_membership_delete_fix.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608080003_p1_workspace_archive_guard.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608080004_p1_draft_workspace_integrity.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608080005_p1_workspace_owner_select.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608080006_p2_conversation_generations.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608080007_p2_archived_workspace_guard.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608100004_p2_conversation_pagination.sql

      - name: Re-run P1 ownership and isolation regressions
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p1_workspace_insert_returning.test.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p1_workspace_rls.test.sql

      - name: Verify P2 conversation lifecycle
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/p2_conversation_lifecycle.test.sql

      - name: Verify P2 pagination summaries and isolation
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/p2_conversation_pagination.test.sql

  data-contract-success:
    name: P2 Conversation Data Success Gate
    runs-on: ubuntu-latest
    needs: [postgres-contract]
    if: always()

    steps:
      - name: Check conversation data contract
        run: |
          if [[ "${{ needs.postgres-contract.result }}" != "success" ]]; then
            echo "P2 conversation migration, lifecycle, pagination, or RLS validation failed"
            exit 1
          fi

          echo "P2 atomic turns, pagination, telemetry, cancellation, retry, archive guards, isolation, and cascades passed."
