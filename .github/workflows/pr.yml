name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest

    steps:
      - name: Check semantic PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$PR_TITLE" =~ ^(feat|fix|docs|style|refactor|perf|test|chore|ci|build|revert)(\(.+\))?:\ .+ ]]; then
            echo "PR title follows the required semantic format."
          else
            echo "PR title must follow: type(scope): description"
            echo "Valid types: feat, fix, docs, style, refactor, perf, test, chore, ci, build, revert"
            exit 1
          fi

  change-scope:
    name: Report Change Scope
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code and history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Report changed files and breaking-change markers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Changed files:"
          git diff --name-status "$BASE_SHA" "$HEAD_SHA"

          if git log --format=%B "$BASE_SHA..$HEAD_SHA" | grep -q "BREAKING CHANGE"; then
            echo "A BREAKING CHANGE marker is present in the pull request commits."
          else
            echo "No BREAKING CHANGE marker is present."
          fi

  rebuild-safeguards:
    name: Rebuild Scope Safeguards
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run active rebuild safeguards
        run: bun run test:rebuild

  pr-validation-success:
    name: PR Validation Success
    runs-on: ubuntu-latest
    needs: [pr-title, change-scope, rebuild-safeguards]
    if: always()

    steps:
      - name: Check all validations passed
        run: |
          if [[ "${{ needs.pr-title.result }}" != "success" ]] || \
             [[ "${{ needs.change-scope.result }}" != "success" ]] || \
             [[ "${{ needs.rebuild-safeguards.result }}" != "success" ]]; then
            echo "PR validation failed"
            exit 1
          fi

          echo "PR title, change scope, and active rebuild safeguards passed."
