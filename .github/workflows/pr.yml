name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  # Validate PR title format
  pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest

    steps:
      - name: Check PR title format
        run: |
          echo "📋 Validating PR title format..."
          PR_TITLE="${{ github.event.pull_request.title }}"
          if [[ "$PR_TITLE" =~ ^(feat|fix|docs|cultural|arabic|style|refactor|perf|test|chore|ci|build|revert)(\(.+\))?:\ .+ ]]; then
            echo "✅ PR title follows semantic format"
          else
            echo "❌ PR title must follow format: type(scope): description"
            echo "Valid types: feat, fix, docs, cultural, arabic, style, refactor, perf, test, chore, ci, build, revert"
            exit 1
          fi

  # Check for breaking changes
  breaking-changes:
    name: Check Breaking Changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for BREAKING CHANGE in commits
        run: |
          BREAKING_CHANGES=$(git log origin/${{ github.base_ref }}..${{ github.sha }} --grep="BREAKING CHANGE" --oneline)
          if [ -n "$BREAKING_CHANGES" ]; then
            echo "⚠️ Breaking changes detected:"
            echo "$BREAKING_CHANGES"
            echo "breaking_changes=true" >> $GITHUB_OUTPUT
          else
            echo "✅ No breaking changes detected"
            echo "breaking_changes=false" >> $GITHUB_OUTPUT
          fi
        id: check-breaking

  # Validate Iraqi cultural compliance
  cultural-validation:
    name: Cultural Compliance Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check for cultural compliance markers
        run: |
          # Check if PR touches cultural-sensitive files
          CULTURAL_FILES=$(git diff --name-only origin/${{ github.base_ref }}...${{ github.sha }} | grep -E "(cultural|arabic|rtl|islamic)" || true)

          if [ -n "$CULTURAL_FILES" ]; then
            echo "📋 Cultural-sensitive files modified:"
            echo "$CULTURAL_FILES"
            echo "cultural_check=required" >> $GITHUB_OUTPUT

            # Require cultural tests if available
            if [ -f "package.json" ] && grep -q "test:cultural" package.json; then
              echo "🧪 Running cultural compliance tests..."
              bun run test:cultural
              echo "✅ Cultural tests must pass (95%+ threshold required)"
            fi
          else
            echo "✅ No cultural-sensitive files modified"
            echo "cultural_check=not_required" >> $GITHUB_OUTPUT
          fi
        id: cultural-check

  # Validate Arabic/RTL changes
  arabic-validation:
    name: Arabic/RTL Compliance Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check for Arabic/RTL changes
        run: |
          # Check if PR touches Arabic/RTL files
          ARABIC_FILES=$(git diff --name-only origin/${{ github.base_ref }}...${{ github.sha }} | grep -E "(arabic|rtl|font-arabic)" || true)

          if [ -n "$ARABIC_FILES" ]; then
            echo "📋 Arabic/RTL files modified:"
            echo "$ARABIC_FILES"
            echo "arabic_check=required" >> $GITHUB_OUTPUT

            # Require Arabic tests if available
            if [ -f "package.json" ] && grep -q "test:arabic" package.json; then
              echo "🧪 Running Arabic/RTL tests..."
              cd apps/web && bunx playwright install chromium --with-deps
              bun run test:arabic
              echo "✅ Arabic tests must pass (99%+ RTL accuracy, 85%+ dialect recognition)"
            fi
          else
            echo "✅ No Arabic/RTL files modified"
            echo "arabic_check=not_required" >> $GITHUB_OUTPUT
          fi
        id: arabic-check

  # Size limit check
  size-check:
    name: Bundle Size Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build applications
        run: |
          echo "⚠️  Build validation temporarily disabled during initial MVP development"
          echo "Will enable after apps have actual code (Initial #16+)"
          echo "✅ Build check passed (Phase 1 - Permissive Mode)"

      - name: Check bundle sizes
        run: |
          echo "⚠️  Bundle size check temporarily disabled during initial MVP development"
          echo "Will enable after Initial #16 (Arabic Foundation Layer)"
          echo "✅ Bundle size check passed (Phase 1 - Permissive Mode)"

  # PR validation success gate
  pr-validation-success:
    name: PR Validation Success
    runs-on: ubuntu-latest
    needs: [pr-title, breaking-changes, cultural-validation, arabic-validation, size-check]
    if: always()

    steps:
      - name: Check all validations passed
        run: |
          if [[ "${{ needs.pr-title.result }}" != "success" ]] || \
             [[ "${{ needs.breaking-changes.result }}" != "success" ]] || \
             [[ "${{ needs.cultural-validation.result }}" != "success" ]] || \
             [[ "${{ needs.arabic-validation.result }}" != "success" ]] || \
             [[ "${{ needs.size-check.result }}" != "success" ]]; then
            echo "❌ PR validation failed"
            exit 1
          fi
          echo "✅ All PR validations passed!"
