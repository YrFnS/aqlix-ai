name: P5 Operational Baseline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_API_URL: "http://127.0.0.1:8000"
  NEXT_PUBLIC_APP_ENV: "development"
  APP_ENV: "test"
  AI_PROVIDER: "fixture"
  P2_ALLOW_FIXTURE_PROVIDER: "true"
  AI_REQUEST_TIMEOUT_MS: "15000"
  RELEASE_SHA: ${{ github.sha }}
  READINESS_PROBE_DEPENDENCIES: "true"
  READINESS_TIMEOUT_MS: "5000"

jobs:
  operational-baseline:
    name: Node Release Startup & Health Contract
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node LTS
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - name: Setup Bun package manager
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies with Bun
        run: bash scripts/ci/install-dependencies.sh

      - name: Start local Supabase
        run: bunx supabase start

      - name: Export local public configuration
        shell: bash
        run: |
          set -euo pipefail
          STATUS_FILE="$(mktemp)"
          bunx supabase status -o env > "$STATUS_FILE"
          set -a
          source "$STATUS_FILE"
          set +a

          PUBLIC_KEY="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
          if [[ -z "${API_URL:-}" ]] || [[ -z "$PUBLIC_KEY" ]]; then
            echo "Local Supabase did not expose API_URL and a public key"
            exit 1
          fi

          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$PUBLIC_KEY" >> "$GITHUB_ENV"

      - name: Build shared packages
        run: bun run build:packages

      - name: Validate operational contracts
        run: |
          node --version
          bun --version
          bash -n scripts/render/build.sh scripts/render/pre-deploy.sh
          bun run validate:release-env
          bun run lint
          bun run typecheck
          bun run test:p5

      - name: Build release web application with Node
        working-directory: apps/web
        run: bun run build:release

      - name: Start release web service with Node
        shell: bash
        run: |
          set -euo pipefail
          cd apps/web
          PORT=3000 bun run start:release > ../../p5-web.log 2>&1 &
          echo $! > ../../p5-web.pid

      - name: Verify liveness and readiness
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health/live > p5-live.json; then
              break
            fi

            if [[ "$attempt" == "60" ]]; then
              echo "Web service did not become live"
              cat p5-web.log || true
              exit 1
            fi

            sleep 1
          done

          curl --fail --silent --show-error \
            http://127.0.0.1:3000/api/health/ready > p5-ready.json

          grep -q '"status":"alive"' p5-live.json
          grep -q '"status":"ready"' p5-ready.json
          grep -q '"configuration":"pass"' p5-ready.json
          grep -q '"supabaseAuth":"pass"' p5-ready.json

          echo "Liveness response:"
          cat p5-live.json
          echo
          echo "Readiness response:"
          cat p5-ready.json
          echo

      - name: Upload operational evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-operational-baseline-evidence
          path: |
            p5-live.json
            p5-ready.json
            p5-web.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop release web service
        if: always()
        shell: bash
        run: |
          if [[ -f p5-web.pid ]]; then
            kill "$(cat p5-web.pid)" 2>/dev/null || true
          fi

      - name: Stop local Supabase
        if: always()
        run: bunx supabase stop --no-backup

  operational-success:
    name: P5 Operational Baseline Success Gate
    runs-on: ubuntu-latest
    needs: [operational-baseline]
    if: always()

    steps:
      - name: Check operational baseline
        run: |
          if [[ "${{ needs.operational-baseline.result }}" != "success" ]]; then
            echo "P5 release build, startup, liveness, readiness, or dependency probe failed"
            exit 1
          fi

          echo "P5 environment preflight, deployment script syntax, Bun-managed Node release build, Node process startup, liveness, fail-closed readiness, and bounded Supabase dependency probe passed."
