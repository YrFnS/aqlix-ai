name: Apply final P3 browser contract fixes

on:
  push:
    branches:
      - agent/e2e-role-security-hardening
    paths:
      - .github/workflows/apply-final-p3-contract-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Align the P3 journey with the portaled product surface
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def lines(*values: str) -> str:
              return "\n".join(values)

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"{path}: expected exactly one match, found {count}"
                  )
              file.write_text(text.replace(old, new), encoding="utf-8")

          path = "apps/web/tests/e2e/p3/document-source-journey.spec.ts"

          replace_once(
              path,
              lines(
                  "  const supportingLink = page.locator(",
                  "    `a[href=\"/workspaces/${workspaceId}/sources/${attachmentId}#source-${firstSourceId}\"]`,",
                  "  );",
              ),
              lines(
                  "  const supportingLink = page",
                  '    .getByRole("main")',
                  "    .locator(",
                  "      `a[href=\"/workspaces/${workspaceId}/sources/${attachmentId}#source-${firstSourceId}\"]`,",
                  "    );",
              ),
          )

          replace_once(
              path,
              '  await page.getByRole("button", { name: "تسجيل الخروج" }).click();',
              lines(
                  '  await page.getByRole("button", { name: "فتح قائمة الحساب" }).click();',
                  '  await page.getByRole("menuitem", { name: "تسجيل الخروج" }).click();',
              ),
          )
          PY

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/tests/e2e/p3/document-source-journey.spec.ts
          git diff --cached --check
          git commit -m "test: scope the portaled P3 browser journey"
          git push origin HEAD:${{ github.ref_name }}

      - name: Audit every remote branch is contained
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --prune
          current="origin/${GITHUB_REF_NAME}"
          missing=0
          count=0

          while IFS= read -r ref; do
            case "$ref" in
              origin/HEAD|"$current")
                continue
                ;;
            esac

            count=$((count + 1))
            if git merge-base --is-ancestor "$ref" HEAD; then
              echo "contained: $ref"
            else
              echo "::error::$ref is not contained in ${GITHUB_REF_NAME}"
              missing=1
            fi
          done < <(
            git for-each-ref --format='%(refname:short)' refs/remotes/origin | sort
          )

          echo "Audited $count remote branches against $(git rev-parse HEAD)."
          exit "$missing"
