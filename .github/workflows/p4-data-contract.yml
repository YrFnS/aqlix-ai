name: P4 Durable Draft Data Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-contract:
    name: PostgreSQL Draft Versions Provenance & RLS
    runs-on: ubuntu-latest
    timeout-minutes: 18

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tuppra_p4_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tuppra_p4_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: tuppra_p4_test
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Prepare Supabase-compatible auth harness
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/p1_test_setup.sql

      - name: Apply P1 migrations
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608080001_p1_workspace_foundation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608080002_p1_owner_membership_delete_fix.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608080003_p1_workspace_archive_guard.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608080004_p1_draft_workspace_integrity.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608080005_p1_workspace_owner_select.sql

      - name: Verify P1 ownership and isolation at the P1 boundary
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p1_workspace_insert_returning.test.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p1_workspace_rls.test.sql

      - name: Apply P2 migrations
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608080006_p2_conversation_generations.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608080007_p2_archived_workspace_guard.sql

      - name: Verify P2 conversation lifecycle at the P2 boundary
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/p2_conversation_lifecycle.test.sql

      - name: Apply P3 migrations
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608080008_p3_document_sources.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608080009_p3_mixed_script_search.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608080010_p3_storage_object_integrity.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608080011_p3_grounded_citations.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608080012_p3_ranked_broad_source_search.sql

      - name: Verify P3 sources and citations at the P3 boundary
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p3_document_sources.test.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/p3_grounded_citations.test.sql

      - name: Apply P4 migrations
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608080013_p4_drafts_and_versions.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608080014_p4_draft_generation_guards.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608080015_p4_origin_delete_integrity.sql

      - name: Verify P4 durable draft lifecycle
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/p4_draft_lifecycle.test.sql

  data-contract-success:
    name: P4 Durable Draft Data Success Gate
    runs-on: ubuntu-latest
    needs: [postgres-contract]
    if: always()

    steps:
      - name: Check durable draft contract
        run: |
          if [[ "${{ needs.postgres-contract.result }}" != "success" ]]; then
            echo "P4 draft version, provenance, proposal, conflict, lifecycle, or RLS validation failed"
            exit 1
          fi

          echo "P1-P3 regressions passed at their schema boundaries; P4 immutable versions, no-op saves, stale-write rejection, provenance snapshots, apply/discard/cancel proposal states, role isolation, archive guards, origin detachment, and cascades passed after forward migration."
