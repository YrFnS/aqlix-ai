name: P5 One-Time OpenRouter Wiring

on:
  push:
    branches: [agent/p5-operational-readiness]
    paths:
      - scripts/maintenance/p5-wire-provider-controls.py
      - .github/workflows/p5-wire-provider-controls.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p5-openrouter-wiring
  cancel-in-progress: false

jobs:
  wire-openrouter:
    name: Wire user runtime, model IDs, and active graph
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout P5 branch
        uses: actions/checkout@v6
        with:
          ref: agent/p5-operational-readiness
          fetch-depth: 0

      - name: Apply targeted edits
        run: python scripts/maintenance/p5-wire-provider-controls.py

      - name: Verify both generation paths and settings graph
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'resolveAiRuntimeConfig' \
            'apps/web/src/app/api/v1/workspaces/[workspaceId]/conversations/[conversationId]/stream/route.ts'
          grep -Fq 'createAiProvider(aiRuntimeConfig, {' \
            'apps/web/src/app/api/v1/workspaces/[workspaceId]/drafts/[draftId]/continue/stream/route.ts'
          grep -Fq 'requestedModel: z.string().min(1).max(255)' \
            packages/types/src/contracts/conversation.ts
          grep -Fq 'src/app/api/v1/ai/models/route.ts' \
            apps/web/tsconfig.rebuild.json
          grep -Fq 'setRefreshIndex((value) => value + 1)' \
            apps/web/src/components/ai/openrouter-settings.tsx
          grep -Fq 'resolveOpenRouterBaseUrl' \
            apps/web/src/lib/ai/openrouter-client.ts

      - name: Commit generated wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            'apps/web/src/app/api/v1/workspaces/[workspaceId]/conversations/[conversationId]/stream/route.ts' \
            'apps/web/src/app/api/v1/workspaces/[workspaceId]/drafts/[draftId]/continue/stream/route.ts' \
            apps/web/src/components/ai/openrouter-settings.tsx \
            apps/web/src/lib/ai/config.ts \
            apps/web/src/lib/ai/openrouter-client.ts \
            apps/web/tsconfig.rebuild.json \
            packages/types/src/contracts/conversation.ts \
            packages/types/src/contracts/draft.ts

          if git diff --cached --quiet; then
            echo "OpenRouter wiring is already current."
            exit 0
          fi

          git commit -m "feat(p5): complete OpenRouter runtime wiring"
          git pull --rebase origin agent/p5-operational-readiness
          git push origin HEAD:agent/p5-operational-readiness
