name: Apply final browser contract fixes

on:
  push:
    branches:
      - agent/e2e-role-security-hardening
    paths:
      - .github/workflows/apply-final-browser-contract-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Align browser journeys with current product surfaces
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          def lines(*values: str) -> str:
              return "\n".join(values)

          def replace_regex(path: str, pattern: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              updated, count = re.subn(
                  pattern,
                  lambda _match: replacement,
                  text,
                  count=1,
                  flags=re.MULTILINE,
              )
              if count != 1:
                  raise RuntimeError(
                      f"{path}: expected exactly one regex match, found {count}"
                  )
              file.write_text(updated, encoding="utf-8")

          replace_regex(
              "apps/web/tests/e2e/p2/conversation-journey.spec.ts",
              r'''  await page\s*\.getByRole\("button", \{ name: "حذف المحادثة ورسائلها" \}\)\s*\.click\(\);''',
              lines(
                  "  const deleteZone = page",
                  '    .locator("details")',
                  '    .filter({ hasText: "منطقة الحذف" });',
                  '  await deleteZone.locator("summary").click();',
                  "  await deleteZone",
                  '    .getByRole("button", { name: "حذف المحادثة", exact: true })',
                  "    .click();",
              ),
          )

          replace_regex(
              "apps/web/tests/e2e/p3/document-source-journey.spec.ts",
              r'''  await page\.setViewportSize\(\{ width: 390, height: 844 \}\);\s*await expect\(firstPassageButton\(page\)\)\.toBeVisible\(\);\s*await page\.setViewportSize\(\{ width: 1280, height: 900 \}\);''',
              lines(
                  "  await page.setViewportSize({ width: 390, height: 844 });",
                  "  await page",
                  '    .getByRole("button", { name: "فتح مقاطع المستند" })',
                  "    .click();",
                  '  const passageDialog = page.getByRole("dialog", {',
                  '    name: "مقاطع المستند",',
                  "  });",
                  "  await expect(passageDialog).toBeVisible();",
                  "  await expect(",
                  '    passageDialog.getByRole("button", { name: /^S1\\s/u }).first(),',
                  "  ).toBeVisible();",
                  "  await passageDialog",
                  '    .getByRole("button", { name: "إغلاق مقاطع المستند" })',
                  "    .click();",
                  "  await expect(passageDialog).toBeHidden();",
                  "  await page.setViewportSize({ width: 1280, height: 900 });",
              ),
          )

          replace_regex(
              "apps/web/tests/e2e/p4/draft-journey.spec.ts",
              r'''async function waitForProposal\(\s*page: Page,\s*instruction: string,\s*\): Promise<void> \{\s*await page\.getByLabel\("إجراء اقتراح المسودة"\)\.selectOption\("custom"\);''',
              lines(
                  "async function waitForProposal(",
                  "  page: Page,",
                  "  instruction: string,",
                  "): Promise<void> {",
                  '  const proposalTab = page.getByRole("button", {',
                  '    name: "الاقتراح",',
                  "    exact: true,",
                  "  });",
                  '  if ((await proposalTab.getAttribute("aria-pressed")) !== "true") {',
                  "    await proposalTab.click();",
                  "  }",
                  '  await expect(page.getByLabel("إجراء اقتراح المسودة")).toBeVisible();',
                  '  await page.getByLabel("إجراء اقتراح المسودة").selectOption("custom");',
              ),
          )

          replace_regex(
              "apps/web/tests/e2e/p5/authenticated-product-journey.spec.ts",
              r'''  await expect\(page\.getByText\(documentName, \{ exact: true \}\)\)\.toBeVisible\(\);''',
              lines(
                  "  await expect",
                  "    .poll(() =>",
                  '      page.locator("#document-file").evaluate((element) => {',
                  "        const input = element as HTMLInputElement;",
                  "        return input.files?.[0]?.name ?? null;",
                  "      }),",
                  "    )",
                  "    .toBe(documentName);",
              ),
          )
          PY

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/tests
          git diff --cached --check
          git commit -m "test: align final browser journeys with current UI"
          git push origin HEAD:${{ github.ref_name }}

      - name: Audit every remote branch is contained
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --prune
          current="origin/${GITHUB_REF_NAME}"
          missing=0
          count=0

          while IFS= read -r ref; do
            case "$ref" in
              origin/HEAD|"$current")
                continue
                ;;
            esac

            count=$((count + 1))
            if git merge-base --is-ancestor "$ref" HEAD; then
              echo "contained: $ref"
            else
              echo "::error::$ref is not contained in ${GITHUB_REF_NAME}"
              missing=1
            fi
          done < <(
            git for-each-ref --format='%(refname:short)' refs/remotes/origin | sort
          )

          echo "Audited $count remote branches against $(git rev-parse HEAD)."
          exit "$missing"
