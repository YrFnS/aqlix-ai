name: Apply final P3 browser contract fixes

on:
  push:
    branches:
      - agent/e2e-role-security-hardening
    paths:
      - .github/workflows/apply-p3-final-contract-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply guarded P3 test fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("apps/web/tests/e2e/p3/document-source-journey.spec.ts")
          text = path.read_text(encoding="utf-8")

          old_link = (
              '  const supportingLink = page.locator(\n'
              '    `a[href="/workspaces/${workspaceId}/sources/${attachmentId}#source-${firstSourceId}"]`,\n'
              '  );'
          )
          new_link = (
              '  const supportingLink = page\n'
              '    .locator(\n'
              '      `a[href="/workspaces/${workspaceId}/sources/${attachmentId}#source-${firstSourceId}"]:visible`,\n'
              '    )\n'
              '    .first();'
          )
          if text.count(old_link) != 1:
              raise RuntimeError("P3 supporting-link contract is missing or ambiguous")
          text = text.replace(old_link, new_link)

          old_logout = '  await page.getByRole("button", { name: "تسجيل الخروج" }).click();'
          new_logout = (
              '  await page.getByRole("button", { name: "فتح قائمة الحساب" }).click();\n'
              '  await page.getByRole("menuitem", { name: "تسجيل الخروج" }).click();'
          )
          if text.count(old_logout) != 1:
              raise RuntimeError("P3 sign-out contract is missing or ambiguous")
          text = text.replace(old_logout, new_logout)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit P3 fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/tests/e2e/p3/document-source-journey.spec.ts
          git diff --cached --check
          git commit -m "test: stabilize final P3 browser journey"
          git push origin HEAD:${{ github.ref_name }}
