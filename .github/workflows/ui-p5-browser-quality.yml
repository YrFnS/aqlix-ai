name: UI P5 Browser Quality

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ui-p5-browser-quality.yml"
      - "apps/web/package.json"
      - "apps/web/playwright.p5.config.ts"
      - "apps/web/src/**"
      - "apps/web/tests/e2e/p5/ui-quality.spec.ts"
      - "packages/ui/**"
      - "package.json"
      - "bun.lock"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  browser-quality:
    name: Desktop, tablet & mobile Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bash scripts/ci/install-dependencies.sh

      - name: Build shared packages
        run: bun run build:packages

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Build web application
        working-directory: apps/web
        run: bun run build

      - name: Run deterministic P5 browser quality audit
        working-directory: apps/web
        run: >-
          bunx playwright test
          tests/e2e/p5/ui-quality.spec.ts
          --config=playwright.p5.config.ts

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-p5-browser-evidence
          path: |
            apps/web/playwright-report/p5
            apps/web/test-results/p5
          if-no-files-found: warn
          retention-days: 14
