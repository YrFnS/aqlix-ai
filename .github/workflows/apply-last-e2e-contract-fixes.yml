name: Apply final E2E contract fixes

on:
  push:
    branches:
      - agent/e2e-role-security-hardening
    paths:
      - .github/workflows/apply-last-e2e-contract-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Update the final browser contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def lines(*values: str) -> str:
              return "\n".join(values)

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"{path}: expected exactly one match, found {count}"
                  )
              file.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "apps/web/tests/e2e/p2/conversation-journey.spec.ts",
              '  await page.getByRole("button", { name: "تسجيل الخروج" }).click();',
              lines(
                  '  await page.getByRole("button", { name: "فتح قائمة الحساب" }).click();',
                  '  await page.getByRole("menuitem", { name: "تسجيل الخروج" }).click();',
              ),
          )

          replace_once(
              "apps/web/tests/e2e/p3/document-source-journey.spec.ts",
              lines(
                  "  await passageDialog",
                  '    .getByRole("button", { name: "إغلاق مقاطع المستند" })',
                  "    .click();",
                  "  await expect(passageDialog).toBeHidden();",
              ),
              lines(
                  '  await page.keyboard.press("Escape");',
                  "  await expect(passageDialog).toBeHidden();",
              ),
          )

          replace_once(
              "apps/web/tests/e2e/p4/draft-journey.spec.ts",
              '  await expect(draftContentField(viewerPage)).toHaveAttribute("readonly", "");',
              lines(
                  '  const viewerEditorTab = viewerPage.getByRole("button", {',
                  '    name: "التحرير",',
                  "    exact: true,",
                  "  });",
                  '  if ((await viewerEditorTab.getAttribute("aria-pressed")) !== "true") {',
                  "    await viewerEditorTab.click();",
                  "  }",
                  "  await expect(draftContentField(viewerPage)).toBeVisible();",
                  '  await expect(draftContentField(viewerPage)).toHaveAttribute("readonly", "");',
              ),
          )
          PY

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/tests
          git diff --cached --check
          git commit -m "test: finish current UI journey alignment"
          git push origin HEAD:${{ github.ref_name }}
