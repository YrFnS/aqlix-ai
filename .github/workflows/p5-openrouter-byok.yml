name: P5 OpenRouter BYOK Journey

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_API_URL: "http://127.0.0.1:8000"
  NEXT_PUBLIC_APP_ENV: "development"
  APP_ENV: "test"
  AI_PROVIDER: "openrouter"
  OPENROUTER_BASE_URL: "http://127.0.0.1:4011/api/v1"
  P2_ALLOW_FIXTURE_PROVIDER: "false"
  AI_REQUEST_TIMEOUT_MS: "15000"
  AI_MAX_OUTPUT_TOKENS: "1024"

jobs:
  openrouter-byok:
    name: Vault Key, Live Catalog & Selected Model Journey
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node LTS
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bash scripts/ci/install-dependencies.sh

      - name: Install Chromium
        working-directory: apps/web
        run: bunx playwright install chromium --with-deps

      - name: Start local Supabase with Vault
        run: bunx supabase start

      - name: Export local Auth, database, and test-admin configuration
        shell: bash
        run: |
          set -euo pipefail
          STATUS_FILE="$(mktemp)"
          bunx supabase status -o env > "$STATUS_FILE"
          set -a
          source "$STATUS_FILE"
          set +a

          PUBLIC_KEY="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
          ADMIN_KEY="${SERVICE_ROLE_KEY:-${SECRET_KEY:-}}"
          if [[ -z "${API_URL:-}" ]] || [[ -z "${DB_URL:-}" ]] || [[ -z "$PUBLIC_KEY" ]] || [[ -z "$ADMIN_KEY" ]]; then
            echo "Local Supabase did not expose API_URL, DB_URL, a public key, and a test admin key"
            exit 1
          fi

          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$PUBLIC_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$ADMIN_KEY" >> "$GITHUB_ENV"
          echo "P5_TEST_DB_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: Verify Vault and account isolation contract
        run: psql "$P5_TEST_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/p5_user_openrouter_settings.test.sql

      - name: Start deterministic OpenRouter API
        shell: bash
        run: |
          set -euo pipefail
          bun apps/web/tests/fixtures/openrouter-mock-server.ts > p5-openrouter-mock.log 2>&1 &
          echo $! > p5-openrouter-mock.pid

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4011/api/v1/health > /dev/null; then
              exit 0
            fi
            if [[ "$attempt" == "30" ]]; then
              cat p5-openrouter-mock.log || true
              exit 1
            fi
            sleep 1
          done

      - name: Build shared packages
        run: bun run build:packages

      - name: Validate OpenRouter and active P5 contracts
        run: |
          bun run lint
          bun run typecheck
          bun run test:p5

      - name: Build web application
        working-directory: apps/web
        run: bun run build

      - name: Run OpenRouter BYOK browser journey
        working-directory: apps/web
        run: >-
          bunx playwright test
          tests/e2e/p5/openrouter-byok-journey.spec.ts
          --config=playwright.p5.config.ts

      - name: Upload OpenRouter evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-openrouter-byok-evidence
          path: |
            apps/web/playwright-report/p5
            apps/web/test-results
            p5-openrouter-mock.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop deterministic OpenRouter API
        if: always()
        shell: bash
        run: |
          if [[ -f p5-openrouter-mock.pid ]]; then
            kill "$(cat p5-openrouter-mock.pid)" 2>/dev/null || true
          fi

      - name: Stop local Supabase
        if: always()
        run: bunx supabase stop --no-backup

  openrouter-success:
    name: P5 OpenRouter BYOK Success Gate
    runs-on: ubuntu-latest
    needs: [openrouter-byok]
    if: always()

    steps:
      - name: Check BYOK journey
        run: |
          if [[ "${{ needs.openrouter-byok.result }}" != "success" ]]; then
            echo "P5 OpenRouter key, Vault, catalog, model selection, streaming, or isolation validation failed"
            exit 1
          fi

          echo "P5 user-owned OpenRouter key validation, encrypted Vault storage, two-account isolation, live catalog filtering, exact model selection, selected-model streaming, telemetry persistence, and disconnect failure behavior passed."
