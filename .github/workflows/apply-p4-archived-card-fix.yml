name: Apply P4 archived-card browser fix
# trigger revision 2

on:
  push:
    branches:
      - agent/e2e-role-security-hardening
    paths:
      - .github/workflows/apply-p4-archived-card-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Align archived draft card selector
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("apps/web/tests/e2e/p4/draft-journey.spec.ts")
          text = path.read_text(encoding="utf-8")
          old = '''  await page
    .locator("article")
    .filter({ hasText: primaryDraft.data.draft.title })
    .getByRole("link", { name: "فتح المسودة" })
    .click();'''
          new = '''  const archivedDraftLink = page
    .locator(
      `a[href="/workspaces/${workspaceId}/drafts/${primaryDraftId}"]:visible`,
    )
    .first();
  await expect(archivedDraftLink).toHaveAccessibleName(
    `فتح المسودة ${primaryDraft.data.draft.title}`,
  );
  await archivedDraftLink.click();'''
          if text.count(old) != 1:
              raise RuntimeError("P4 archived-card selector is missing or ambiguous")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-p4-archived-card-fix.yml
          git add apps/web/tests/e2e/p4/draft-journey.spec.ts
          git diff --cached --check
          git commit -m "test: target the archived P4 draft card"
          git push origin HEAD:${{ github.ref_name }}
