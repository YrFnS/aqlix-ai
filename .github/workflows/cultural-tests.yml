name: Cultural Compliance Testing

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same workflow and branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cultural-compliance:
    name: Cultural & Islamic Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run cultural compliance tests
        run: |
          echo "🧪 Running cultural compliance tests..."
          bun run test:cultural || echo "⚠️  Cultural test warnings (Phase 2 - non-blocking)"
          echo "✅ Cultural tests complete (with warnings)"
        id: cultural-tests

      - name: Validate cultural compliance threshold (95%+)
        run: |
          echo "📊 Validating cultural compliance threshold..."

          # Install jq for JSON parsing if not available
          if ! command -v jq &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y jq bc
          fi

          # Run tests with JSON output and extract cultural compliance score
          # Note: This assumes test:cultural outputs JSON with culturalCompliance field
          # Adjust path/field based on actual test output structure
          TEST_OUTPUT=$(bun run test:cultural --json 2>/dev/null || echo '{"culturalCompliance": 0}')
          CULTURAL_SCORE=$(echo "$TEST_OUTPUT" | jq -r '.culturalCompliance // 0')

          echo "📊 Cultural Compliance Score: ${CULTURAL_SCORE}%"

          # Validate 95% threshold
          if (( $(echo "$CULTURAL_SCORE < 95" | bc -l) )); then
            echo "❌ Cultural compliance $CULTURAL_SCORE% below required 95%"
            echo "::error::Cultural compliance threshold not met. Required: 95%, Actual: $CULTURAL_SCORE%"
            exit 1
          fi

          echo "✅ Cultural appropriateness: ${CULTURAL_SCORE}%+ (meets 95% requirement)"

      - name: Upload cultural compliance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cultural-compliance-report
          path: |
            **/coverage/
            **/test-results/
          retention-days: 7

  professional-domain-validation:
    name: Iraqi Professional Domain Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate professional terminology
        run: |
          echo "📋 Validating professional domain terminology..."
          echo "✅ Checking NAMING_CONVENTIONS.md compliance..."

          # Check for government/ministry terminology (should be transformed to professional)
          if grep -r "government\|ministry" apps/web/src --include="*.tsx" --include="*.ts" | grep -v "node_modules" | grep -v ".next" | grep -v "test" > /dev/null; then
            echo "⚠️ WARNING: Found potential government/ministry references"
            echo "Please transform to professional terminology per NAMING_CONVENTIONS.md"
            # Don't fail CI - just warn for now
          else
            echo "✅ No government/ministry terminology found"
          fi

          echo "✅ Professional domain validation complete"

      - name: Check Iraqi cultural patterns
        run: |
          echo "🌍 Checking Iraqi cultural patterns..."

          # Make script executable
          chmod +x scripts/validate-iraqi-cultural.sh

          # Run actual cultural validation script
          if scripts/validate-iraqi-cultural.sh; then
            echo "✅ All cultural pattern checks passed"
            echo "✅ Political neutrality: Validated"
            echo "✅ Family/social respect: Validated"
            echo "✅ Gender-appropriate language: Validated"
            echo "✅ Islamic compliance: Validated"
            echo "✅ Professional domain: Validated"
          else
            echo "❌ Cultural pattern validation failed"
            exit 1
          fi

  cultural-success:
    name: Cultural Tests Success Gate
    runs-on: ubuntu-latest
    needs: [cultural-compliance, professional-domain-validation]
    if: always()

    steps:
      - name: Check all cultural tests passed
        run: |
          if [[ "${{ needs.cultural-compliance.result }}" != "success" ]] || \
             [[ "${{ needs.professional-domain-validation.result }}" != "success" ]]; then
            echo "❌ Cultural compliance validation failed"
            exit 1
          fi
          echo "✅ All cultural compliance tests passed!"
