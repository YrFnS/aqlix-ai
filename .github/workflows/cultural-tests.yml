name: Product Language & Claims Safeguards

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  language-utilities:
    name: Arabic Text Utility Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bash scripts/ci/install-dependencies.sh

      - name: Build shared packages in dependency order
        run: bun run build:packages

      - name: Test Arabic text processing
        run: bun run --filter @iraqi-ai/arabic-nlp test

      - name: Test bidirectional input utilities
        run: bun run --filter @iraqi-ai/ui test

  public-claims:
    name: Complete Public Route & Claims Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bash scripts/ci/install-dependencies.sh

      - name: Verify brand and every routable page
        run: |
          bun run test:brand
          bun test apps/web/tests/rebuild/public-route-surface.test.ts

  safeguards-success:
    name: Product Safeguards Success Gate
    runs-on: ubuntu-latest
    needs: [language-utilities, public-claims]
    if: always()

    steps:
      - name: Check evidence-based safeguards
        run: |
          if [[ "${{ needs.language-utilities.result }}" != "success" ]] || \
             [[ "${{ needs.public-claims.result }}" != "success" ]]; then
            echo "Product language or complete public-route safeguards failed"
            exit 1
          fi

          echo "Arabic utility tests and complete routable-surface safeguards passed."
          echo "These checks do not certify cultural, religious, legal, or professional compliance."
