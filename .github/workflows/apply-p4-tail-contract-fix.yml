name: Apply final P4 tail contract fix

on:
  push:
    branches:
      - agent/e2e-role-security-hardening
    paths:
      - .github/workflows/apply-p4-tail-contract-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Align the archived-draft tail with the current product UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def lines(*values: str) -> str:
              return "\n".join(values)

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"{path}: expected exactly one match, found {count}"
                  )
              file.write_text(text.replace(old, new), encoding="utf-8")

          path = "apps/web/tests/e2e/p4/draft-journey.spec.ts"

          replace_once(
              path,
              lines(
                  "  await page",
                  '    .locator("article")',
                  "    .filter({ hasText: primaryDraft.data.draft.title })",
                  '    .getByRole("link", { name: "فتح المسودة" })',
                  "    .click();",
              ),
              lines(
                  "  await page",
                  '    .getByRole("main")',
                  '    .getByRole("link", {',
                  "      name: `فتح المسودة ${primaryDraft.data.draft.title}` ,",
                  "      exact: true,",
                  "    })",
                  "    .click();",
              ),
          )

          replace_once(
              path,
              lines(
                  "  await page.goto(`/workspaces/${workspaceId}/drafts/${primaryDraftId}`);",
                  '  await expect(draftContentField(page)).toHaveAttribute("readonly", "");',
              ),
              lines(
                  "  await page.goto(`/workspaces/${workspaceId}/drafts/${primaryDraftId}`);",
                  '  const archivedWorkspaceEditorTab = page.getByRole("button", {',
                  '    name: "التحرير",',
                  "    exact: true,",
                  "  });",
                  '  if ((await archivedWorkspaceEditorTab.getAttribute("aria-pressed")) !== "true") {',
                  "    await archivedWorkspaceEditorTab.click();",
                  "  }",
                  "  await expect(draftContentField(page)).toBeVisible();",
                  '  await expect(draftContentField(page)).toHaveAttribute("readonly", "");',
              ),
          )
          PY

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/tests/e2e/p4/draft-journey.spec.ts
          git diff --cached --check
          git commit -m "test: align the archived P4 draft tail"
          git push origin HEAD:${{ github.ref_name }}

      - name: Audit every remote branch is contained
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --prune
          current="origin/${GITHUB_REF_NAME}"
          missing=0
          count=0

          while IFS= read -r ref; do
            case "$ref" in
              origin/HEAD|"$current")
                continue
                ;;
            esac

            count=$((count + 1))
            if git merge-base --is-ancestor "$ref" HEAD; then
              echo "contained: $ref"
            else
              echo "::error::$ref is not contained in ${GITHUB_REF_NAME}"
              missing=1
            fi
          done < <(
            git for-each-ref --format='%(refname:short)' refs/remotes/origin | sort
          )

          echo "Audited $count remote branches against $(git rev-parse HEAD)."
          exit "$missing"
