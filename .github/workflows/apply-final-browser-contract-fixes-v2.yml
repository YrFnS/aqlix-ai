name: Apply final browser contract fixes v2

on:
  push:
    branches:
      - agent/e2e-role-security-hardening
    paths:
      - .github/workflows/apply-final-browser-contract-fixes-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Format the guarded portal block
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          file = Path(
              "apps/web/src/components/documents/document-workspace.tsx"
          )
          text = file.read_text(encoding="utf-8")
          start_marker = (
              "              <AnimatePresence>\n"
              "        {passagePanelOpen ? ("
          )
          end_marker = "      </AnimatePresence>\n            </>,"

          if text.count(start_marker) != 1:
              raise RuntimeError("portal block start is missing or ambiguous")
          if text.count(end_marker) != 1:
              raise RuntimeError("portal block end is missing or ambiguous")

          start = text.index(start_marker)
          end = text.index(end_marker, start) + len("      </AnimatePresence>")
          block = text[start:end]
          lines = block.splitlines()
          formatted = "\n".join(
              [lines[0], *[("        " + line) if line else line for line in lines[1:]]]
          )
          file.write_text(text[:start] + formatted + text[end:], encoding="utf-8")
          PY

      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/documents/document-workspace.tsx
          git diff --cached --check
          git commit -m "style: format document drawer portal"
          git push origin HEAD:${{ github.ref_name }}
