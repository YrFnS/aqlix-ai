services:
  - type: web
    name: kiteb-staging
    runtime: node
    branch: develop
    region: frankfurt
    plan: starter
    autoDeployTrigger: off
    buildCommand: bash scripts/render/build.sh
    preDeployCommand: bash scripts/render/pre-deploy.sh
    startCommand: bun run start:release
    healthCheckPath: /api/health/ready
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: BUN_VERSION
        value: 1.3.14
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: NEXT_PUBLIC_APP_ENV
        value: staging
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: AI_PROVIDER
        value: openrouter
      - key: P2_ALLOW_FIXTURE_PROVIDER
        value: "false"
      - key: AI_REQUEST_TIMEOUT_MS
        value: "60000"
      - key: AI_MAX_OUTPUT_TOKENS
        value: "2048"
      - key: READINESS_PROBE_DEPENDENCIES
        value: "true"
      - key: READINESS_TIMEOUT_MS
        value: "5000"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_ACCESS_TOKEN
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: SUPABASE_PROJECT_ID
        sync: false
